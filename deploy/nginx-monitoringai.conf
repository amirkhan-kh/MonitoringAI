# MonitoringAI — brand monitoring dashboard.
# Separate, non-default server block. Does NOT modify legalai (default_server) or teleselloai.
# Frontend: static SPA at /opt/monitoringai/frontend-dist
# API:      dockerized FastAPI bound to 127.0.0.1:18090, proxied under /api/
# TLS is added by certbot --nginx (Let's Encrypt) after this file is enabled.
server {
    server_name monitoring.avioraai.uz;

    client_max_body_size 20M;

    root /opt/monitoringai/frontend-dist;
    index index.html;

    # Server-Sent Events stream — must not be buffered, long-lived.
    location = /api/events {
        proxy_pass http://127.0.0.1:18090/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Everything under /api/ -> FastAPI (the trailing slash strips the /api prefix,
    # so /api/health reaches the backend as /health).
    location /api/ {
        proxy_pass http://127.0.0.1:18090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Always revalidate the SPA shell so new hashed assets are picked up after deploys.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Static SPA (no client-side router — serve index.html as fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
    listen [::]:80;
}
