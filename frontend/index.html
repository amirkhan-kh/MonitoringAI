<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="MonitoringAI by Aviora AI — Telegram, YouTube va Instagram izohlarini yig'ib, AI yordamida kayfiyat va obro' xavfini tahlil qiluvchi brend monitoring platformasi." />
    <title>MonitoringAI — brend monitoring platformasi | Aviora AI</title>
    <script>
      (function () {
        try {
          var key = "monitoring_ui_theme";
          var stored = localStorage.getItem(key);
          var path = location.pathname || "";
          var isLogin = path === "/login" || path.indexOf("/login") === 0;
          /* Defaults: login light, landing + dashboard dark. Stored toggle wins. */
          var theme = stored === "light" || stored === "dark"
            ? stored
            : (isLogin ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
